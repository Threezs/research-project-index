name: validate-index

on:
  push:
    paths:
      - "repos.csv"
      - "project_status.yml"
  pull_request:

jobs:
  csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -c "import csv; list(csv.DictReader(open('repos.csv', encoding='utf-8')))"
